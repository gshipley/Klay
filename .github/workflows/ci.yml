name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      # Flatpak updates rename SDK deployments; image-layer directories cannot
      # be renamed on OverlayFS. Docker prepopulates this writable volume.
      options: --privileged --volume /var/lib/flatpak
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit pinned Python dependencies
        run: python3 build-aux/audit-dependencies.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Flatpak Builder
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: com.grantshipley.Klay.Devel.flatpak
          manifest-path: build-aux/flatpak/com.grantshipley.Klay.Devel.json
          run-tests: true
          upload-artifact: false

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Linux Flatpak
          if-no-files-found: error
          compression-level: 0
          path: com.grantshipley.Klay.Devel.flatpak

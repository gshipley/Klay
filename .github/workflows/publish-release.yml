name: Publish Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}

jobs:
  publish-release:
    name: Build And Publish Release
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag and app version
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "app_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Sync Meson version with tag
        run: |
          version="${{ steps.version.outputs.app_version }}"
          sed -i -E "/^[[:space:]]*version:[[:space:]]*'/ s/'[^']+'/'${version}'/" meson.build
          grep -nE "^[[:space:]]*(version|meson_version):" meson.build

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.5
        with:
          bundle: com.grantshipley.Klay.Devel.flatpak
          manifest-path: build-aux/flatpak/com.grantshipley.Klay.Devel.json

      - name: Create release notes
        run: |
          tag="${{ steps.version.outputs.tag_name }}"
          release_doc="docs/releases/${tag}.md"
          if [ -f "${release_doc}" ]; then
            cp "${release_doc}" release_notes
            exit 0
          fi

          previous_tag="$(
            git tag --list 'v*' --sort=-version:refname \
              | grep -Fxv "${tag}" \
              | head -n 1
          )"
          if [ -n "${previous_tag}" ]; then
            git log --pretty='- %s' "${previous_tag}..${tag}" \
              | sed '/^-[[:space:]]*$/d' \
              | head -n 25 \
              > release_changes
          else
            git log --pretty='- %s' "${tag}" \
              | sed '/^-[[:space:]]*$/d' \
              | head -n 25 \
              > release_changes
          fi
          if [ ! -s release_changes ]; then
            printf '%s\n' "- Maintenance update" > release_changes
          fi

          cp .github/RELEASE_NOTES_TEMPLATE.md release_notes
          sed -i "1s|^# Klay vX.Y.Z$|# Klay ${tag}|" release_notes

          awk '
            BEGIN {
              while ((getline line < "release_changes") > 0) {
                changes = changes line "\n"
              }
            }
            {
              if ($0 == "## Changed") {
                print
                printf "%s", changes
                print ""
                in_changed = 1
                next
              }
              if (in_changed && /^## /) {
                in_changed = 0
              }
              if (in_changed) {
                next
              }
              print
            }
          ' release_notes > release_notes.tmp
          mv release_notes.tmp release_notes

          if [ -n "${previous_tag}" ]; then
            printf '\n> Auto-summary source: %s..%s\n' "${previous_tag}" "${tag}" >> release_notes
          else
            printf '\n> Auto-summary source: %s\n' "${tag}" >> release_notes
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: |
            com.grantshipley.Klay.Devel.flatpak
          fail_on_unmatched_files: true
          tag_name: ${{ steps.version.outputs.tag_name }}
          body_path: release_notes

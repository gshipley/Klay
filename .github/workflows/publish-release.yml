name: Publish Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: Build And Test Release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Audit pinned Python dependencies
        run: python3 build-aux/audit-dependencies.py

      - name: Sync Meson version with tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          sed -i -E "/^[[:space:]]*version:[[:space:]]*'/ s/'[^']+'/'${version}'/" meson.build
          grep -nE "^[[:space:]]*(version|meson_version):" meson.build

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: com.grantshipley.Klay.Devel.flatpak
          manifest-path: build-aux/flatpak/com.grantshipley.Klay.Devel.json
          run-tests: true
          upload-artifact: false

      - name: Create release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          release_doc="docs/releases/${tag}.md"
          if [ -f "${release_doc}" ]; then
            cp "${release_doc}" release_notes
            exit 0
          fi

          previous_tag="$(
            git tag --list 'v*' --sort=-version:refname \
              | grep -Fxv "${tag}" \
              | head -n 1
          )"
          if [ -n "${previous_tag}" ]; then
            git log --pretty='- %s' "${previous_tag}..${tag}" \
              | sed '/^-[[:space:]]*$/d' \
              | head -n 25 \
              > release_changes
          else
            git log --pretty='- %s' "${tag}" \
              | sed '/^-[[:space:]]*$/d' \
              | head -n 25 \
              > release_changes
          fi
          if [ ! -s release_changes ]; then
            printf '%s\n' "- Maintenance update" > release_changes
          fi

          cp .github/RELEASE_NOTES_TEMPLATE.md release_notes
          sed -i "1s|^# Klay vX.Y.Z$|# Klay ${tag}|" release_notes

          awk '
            BEGIN {
              while ((getline line < "release_changes") > 0) {
                changes = changes line "\n"
              }
            }
            {
              if ($0 == "## Changed") {
                print
                printf "%s", changes
                print ""
                in_changed = 1
                next
              }
              if (in_changed && /^## /) {
                in_changed = 0
              }
              if (in_changed) {
                next
              }
              print
            }
          ' release_notes > release_notes.tmp
          mv release_notes.tmp release_notes

          if [ -n "${previous_tag}" ]; then
            printf '\n> Auto-summary source: %s..%s\n' "${previous_tag}" "${tag}" >> release_notes
          else
            printf '\n> Auto-summary source: %s\n' "${tag}" >> release_notes
          fi

      - name: Upload tested release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            com.grantshipley.Klay.Devel.flatpak
            release_notes
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-release:
    name: Publish Tested Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          digest-mismatch: error

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            com.grantshipley.Klay.Devel.flatpak
          fail_on_unmatched_files: true
          tag_name: ${{ github.ref_name }}
          body_path: release_notes

name: Publish Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}

jobs:
  publish-release:
    name: Build And Publish Release
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag and app version
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "app_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Sync Meson version with tag
        run: |
          version="${{ steps.version.outputs.app_version }}"
          sed -i -E "/^[[:space:]]*version:[[:space:]]*'/ s/'[^']+'/'${version}'/" meson.build
          grep -nE "^[[:space:]]*(version|meson_version):" meson.build

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.5
        with:
          bundle: com.grantshipley.Klay.Devel.flatpak
          manifest-path: build-aux/flatpak/com.grantshipley.Klay.Devel.json

      - name: Create release notes
        run: |
          tag="${{ steps.version.outputs.tag_name }}"
          previous_tag="$(
            git tag --list 'v*' --sort=-version:refname \
              | grep -Fxv "${tag}" \
              | head -n 1
          )"
          if [ -n "${previous_tag}" ]; then
            changes="$(
              git log --pretty='- %s' "${previous_tag}..${tag}" \
                | sed '/^-[[:space:]]*$/d' \
                | head -n 25
            )"
          else
            changes="$(
              git log --pretty='- %s' "${tag}" \
                | sed '/^-[[:space:]]*$/d' \
                | head -n 25
            )"
          fi
          if [ -z "${changes}" ]; then
            changes="- Maintenance update"
          fi

          {
            echo "Klay ${tag}"
            echo
            if [ -n "${previous_tag}" ]; then
              echo "## Changes Since ${previous_tag}"
            else
              echo "## Highlights"
            fi
            printf '%s\n' "${changes}"
            echo
            echo "## Download"
            echo "- \`com.grantshipley.Klay.Devel.flatpak\`"
            echo
            echo "## Install"
            echo '```bash'
            echo "flatpak install --user --reinstall ./com.grantshipley.Klay.Devel.flatpak"
            echo "flatpak run com.grantshipley.Klay.Devel"
            echo '```'
          } > release_notes

      - name: Publish release
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: |
            com.grantshipley.Klay.Devel.flatpak
          fail_on_unmatched_files: true
          tag_name: ${{ steps.version.outputs.tag_name }}
          body_path: release_notes
